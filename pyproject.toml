[project]
name = "frigate-apple-silicon-detector"
version = "2.0.0"
description = "A frigate detector that leverages Apple silicon"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4",
    "opencv-python-headless>=4.13",
    "onnxruntime>=1.24",
    "pyzmq>=27.1",
]

[project.scripts]
detector = "detector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["detector"]

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
    "pytest>=8.0",
    "ruff>=0.11",
    "pyright>=1.1.350",
]


[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["detector"]
exclude = ["build", "dist", "macos/build"]
